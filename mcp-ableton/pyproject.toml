[project]
name = "astra-daw-guard-ableton-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Ableton Live song/track state via AbletonOSC (astra-daw-guard)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "python-osc>=1.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ableton_mcp*"]
